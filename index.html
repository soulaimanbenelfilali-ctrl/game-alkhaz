<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألغاز بلادي 🇲🇦</title>
    <style>
        :root {
            --red-morocco: #c1272d;
            --green-morocco: #006233;
            --gold: #d4af37;
            --bg-color: #f4ebd8;
            --text-dark: #2c1e16;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 0l20 20-20 20L0 20z" fill="%23e8dec5" fill-opacity="0.4" fill-rule="evenodd"/></svg>');
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            border: 3px solid var(--gold);
            margin: 15px;
        }

        h1 {
            color: var(--red-morocco);
            margin-bottom: 5px;
        }

        .level-badge {
            background: var(--gold);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--green-morocco);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background: #004d28;
            transform: scale(1.02);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-correct { background: var(--green-morocco) !important; color: white !important; }
        .btn-wrong { background: var(--red-morocco) !important; color: white !important; }

        .question-box {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
            border: 2px dashed var(--red-morocco);
        }

        .timer {
            font-size: 30px;
            font-weight: bold;
            color: var(--red-morocco);
            margin: 15px 0;
        }

        .timer.hurry {
            color: red;
            animation: pulse 0.5s infinite;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            padding: 10px;
            background: #eee;
            border-radius: 10px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة البداية -->
        <div id="start-screen" class="screen active">
            <h1>ألغاز بلادي 🇲🇦</h1>
            <p>100 لغز، 10 جولات.. واش قاد على التحدي؟</p>
            <p>عندك 20 ثانية لكل سؤال، فكر مزيان قبل ما تجاوب!</p>
            <button class="btn" onclick="startGame()">بـدا اللـعـب</button>
        </div>

        <!-- شاشة اللعب -->
        <div id="game-screen" class="screen">
            <div class="level-badge" id="level-display">الجولة 1</div>
            <div class="stats">
                <span id="score-display">النقاط: 0</span>
                <span id="question-count">السؤال: 1/10</span>
            </div>
            
            <div class="timer" id="timer">20</div>
            
            <div class="question-box" id="question-text">جارٍ التحميل...</div>
            
            <div id="options-container">
                <!-- الأزرار ستضاف هنا عبر الجافاسكربت -->
            </div>

            <button id="next-btn" class="btn" style="display: none; background: var(--gold);" onclick="nextQuestion()">السؤال التالي ➔</button>
        </div>

        <!-- شاشة نهاية الجولة -->
        <div id="level-complete-screen" class="screen">
            <h1 style="color: var(--green-morocco);">برافو عليك! 🎉</h1>
            <p id="level-msg">ساليتي هاد الجولة بنجاح.</p>
            <button class="btn" onclick="startLevel()">دوز للجولة الجاية</button>
        </div>

        <!-- شاشة النتيجة النهائية -->
        <div id="result-screen" class="screen">
            <h1>النهاية! 🏆</h1>
            <div class="question-box">
                <h2 id="final-score">النقاط: 0</h2>
                <p id="final-eval">التقييم: مبتدئ</p>
            </div>
            <button class="btn" onclick="location.reload()">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        // الألغاز (تقدر تزيد عليها باش تكمل 100)
        const allQuestions = [
            { q: "شنو هو اللي عندو سنان وما كيعضش؟", options: ["المشط", "المنشار", "الكلب", "الفم"], answer: 0 },
            { q: "دار بلا بيبان وبلا شرجم، شنو هي؟", options: ["البيضة", "البطيخة", "القبر", "الصندوق"], answer: 0 },
            { q: "شنو هو اللي كيمشي بلا رجلين؟", options: ["الوقت", "الريح", "الماء", "الظل"], answer: 0 },
            { q: "شنو هو اللي كلما خديتي منو كيكبر؟", options: ["الحفرة", "العمر", "الجيب", "الظل"], answer: 0 },
            { q: "شنو هو اللي عندو عين وما كيشوفش؟", options: ["الإبرة", "البحر", "الباب", "العمى"], answer: 0 },
            { q: "أبيض من الثلج وكحل من الليل، كلو حلال وشربو حرام؟", options: ["المقبرة", "القهوة", "الزيتون", "السراب"], answer: 0 },
            { q: "طير طار في السما، ما عندو ريش وما عندو جناح؟", options: ["الدخان", "السحاب", "الطيارة", "الصاروخ"], answer: 0 },
            { q: "حاجة كتدخل ناشفة وكتخرج فازكة؟", options: ["الخيط فالإبرة", "أكياس أتاي", "الفوطة", "المعلقة"], answer: 1 },
            { q: "عندو وراق وماشي شجرة، وكيهضر وماشي بنادم؟", options: ["الكتاب", "التلفزة", "الراديو", "البحر"], answer: 0 },
            { q: "إلى طاح ف الأرض ما يتهرسش، وإلى طاح ف الما يفزك؟", options: ["الظل", "الورقة", "الحجرة", "الريشة"], answer: 1 },
            { q: "كيمشي ويجي وما كيوصل فين؟", options: ["الباب", "المكانة", "القطار", "الظل"], answer: 0 },
            { q: "شنو هي الحاجة اللي كتشوفها وما تقدرش تقيسها؟", options: ["الظل", "السما", "الهواء", "الشمس"], answer: 0 },
            { q: "عمتي وعمتك كيتشاركو ف عمة وحدة، شكون هي؟", options: ["جدتي", "خالتي", "مي", "عمتي"], answer: 0 },
            { q: "شنو هو الشي اللي يقرصك وما تشوفوش؟", options: ["الجوع", "البرد", "الناموس", "الريح"], answer: 1 },
            { q: "كيبكي بلا عينين وكيمشي بلا رجلين؟", options: ["السحاب", "الوقت", "القلم", "الريح"], answer: 0 },
            { q: "بنت الملك جالسة ف وسط الما وما فازكاش؟", options: ["الضفدعة", "الزيت", "السفينة", "السمكة"], answer: 1 },
            { q: "خضر فالسوق، وحمر فالدار؟", options: ["الحنا", "النعناع", "أتاي", "مطيشة"], answer: 0 },
            { q: "قداش ما طالت كتقصار؟", options: ["الأعمار", "الشمعة", "السيجارة", "الطريق"], answer: 0 },
            { q: "ميت وكيبكي على الحي؟", options: ["العود ديال الشتا", "السحاب", "البصلة", "الناي"], answer: 0 },
            { q: "عندو عنق وما عندو راس؟", options: ["القرعة", "الكاس", "البراد", "الصينية"], answer: 0 }
        ];

        let currentQuestionIndex = 0;
        let currentLevel = 1;
        let score = 0;
        let timeLeft = 20;
        let timerInterval;
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'tick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'levelUp') {
                osc.type = 'square';
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine'; o.frequency.value = freq;
                        o.connect(g); g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        o.start(); o.stop(audioCtx.currentTime + 0.3);
                    }, i * 150);
                });
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            initAudio(); 
            score = 0;
            currentLevel = 1;
            currentQuestionIndex = 0;
            startLevel();
        }

        function startLevel() {
            showScreen('game-screen');
            document.getElementById('level-display').innerText = `الجولة ${currentLevel}`;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            document.getElementById('next-btn').style.display = 'none';
            
            if (currentQuestionIndex >= allQuestions.length) {
                endGame();
                return;
            }

            const qData = allQuestions[currentQuestionIndex];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('question-count').innerText = `السؤال: ${(currentQuestionIndex % 10) + 1}/10`;
            document.getElementById('score-display').innerText = `النقاط: ${score}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            timeLeft = 20;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = timeLeft;
            timerEl.className = 'timer';
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                
                if (timeLeft <= 5 && timeLeft > 0) {
                    timerEl.classList.add('hurry');
                    playSound('tick');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1, null); 
                }
            }, 1000);
        }

        function handleAnswer(selectedIndex, btnElement) {
            clearInterval(timerInterval); 
            
            const qData = allQuestions[currentQuestionIndex];
            const buttons = document.getElementById('options-container').querySelectorAll('.btn');
            
            buttons.forEach(b => b.disabled = true);
            
            if (selectedIndex === qData.answer) {
                if(btnElement) btnElement.classList.add('btn-correct');
                score += 10;
                document.getElementById('score-display').innerText = `النقاط: ${score}`;
                playSound('correct');
            } else {
                if(btnElement) btnElement.classList.add('btn-wrong');
                buttons[qData.answer].classList.add('btn-correct');
                playSound('wrong');
            }
            
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex > 0 && currentQuestionIndex % 10 === 0) {
                if (currentQuestionIndex >= allQuestions.length) {
                    endGame(); 
                } else {
                    currentLevel++;
                    playSound('levelUp');
                    showScreen('level-complete-screen');
                    document.getElementById('level-msg').innerText = `ممتاز! راك جمعتي ${score} نقطة لحد الآن. مستعد للجولة ${currentLevel}؟`;
                }
            } else {
                loadQuestion(); 
            }
        }

        function endGame() {
            showScreen('result-screen');
            playSound('levelUp');
            document.getElementById('final-score').innerText = `النقاط: ${score}`;
            
            let eval = "";
            if(score < 50) eval = "مبتدئ.. خاصك تدريب ف الدارجة!";
            else if(score < 150) eval = "ذكي.. عندك مع الألغاز!";
            else eval = "عبقري الفكاكة! 👑 معلم دينا";
            
            document.getElementById('final-eval').innerText = `التقييم: ${eval}`;
        }
    </script>
</body>
</html>
